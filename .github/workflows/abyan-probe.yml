name: abyan-probe
# فحص: هل سيرفر أبيان يسمح للبوت يتصل فيه مباشرة (OAuth) من GitHub
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in .well-known/oauth-protected-resource .well-known/oauth-protected-resource/mcp .well-known/oauth-authorization-server .well-known/openid-configuration; do
            echo "=== $p"; curl -sS -m 20 "https://mcp.abyancapital.sa/$p" | head -c 3000; echo; done
          echo "=== POST /mcp (no token)"
          curl -sS -m 20 -i -X POST https://mcp.abyancapital.sa/mcp -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"almilyoni-bot","version":"1"}}}' | head -c 2000
          echo; echo "=== POST / (no token)"
          curl -sS -m 20 -i -X POST https://mcp.abyancapital.sa/ -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{}' | head -c 1500
