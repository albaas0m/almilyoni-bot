name: almilyoni-live
# الشموع من حساب TradingView، وسعر العقد من أبيان
# وقت السوق الأمريكي (أيام التداول): البوت يراقب الإشارات ويسجل سعر العقد من أبيان لحظة الدخول والخروج — بدون Claude
# كل جوب (حده 6 ساعات) يشغّل اللي بعده بنفسه، فدايم فيه جوب ينتظر الافتتاح أو يراقب السوق
# (19 نوفمبر) جدول GitHub كان يتأخر ~8 ساعات (يشتغل بعد الإغلاق): صار فيه كذا موعد قبل الافتتاح بدقائق مو على رأس الساعة،
# والجوب اللي يبدأ بدري ينتظر الافتتاح، واللي بعده ينتظر في الطابور ويطلع على طول إذا السوق سكر
# (20 نوفمبر) التشغيل صار من مهمة Claude المجدولة كل يوم 8:58 نيويورك (مواعيد GitHub تتأخر ساعات)، والبوت يقفل نفسه بعد الإغلاق
on:
  workflow_dispatch:
    inputs:
      test: {description: 'اختبار: سهم واتجاه مثل AMD P (فاضي = تشغيل عادي)', required: false, default: ''}
permissions:
  contents: write
  actions: write
concurrency:
  group: almilyoni-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q cryptography
      - name: المراقبة اللحظية
        env:
          ABYAN_KEY: ${{ secrets.ABYAN_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_KEY: ${{ secrets.NTFY_KEY }}
        run: |
          git config user.name "almilyoni-bot"; git config user.email "almilyoni-bot@users.noreply.github.com"
          if [ -n "${{ github.event.inputs.test }}" ]; then python3 live_abyan.py --test ${{ github.event.inputs.test }}; else python3 live_abyan.py; fi
      - name: تشغيل الجوب اللي بعده (إذا السوق لسا مفتوح)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .again ]; then for i in 1 2 3; do gh workflow run live.yml --ref main -R "$GITHUB_REPOSITORY" && echo "شغّلت الجوب اللي بعده" && break; sleep 20; done; fi
